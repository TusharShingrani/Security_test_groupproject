# ─────────────────────────────────────────────────────────────────────────────
# Azure DevOps Pipeline – WSS Unauthorized Client PoC
#
# No marketplace extensions required. Uses only built-in script steps.
# Terraform authenticates to Azure via Service Principal environment variables
# set as pipeline secret variables (ARM_CLIENT_ID, etc.).
#
# AGENT POOL NOTE:
#   This pipeline uses a self-hosted agent (pool: Default) to avoid the
#   "No hosted parallelism" error on free Azure DevOps organisations.
#   Microsoft-hosted agents require a paid or granted parallelism slot.
#
#   To register a free self-hosted agent on any Linux machine (including WSL):
#     1. Azure DevOps → Project settings → Agent pools → Default → New agent
#     2. Follow the download + configure steps (takes ~5 minutes)
#     3. Run: ./run.sh   (or install as a service with ./svc.sh install)
#   The agent machine needs: bash, curl/wget, git, unzip. Terraform is
#   installed by this pipeline script so it does NOT need to be pre-installed.
#
#   Alternatively, request a free Microsoft-hosted parallelism grant:
#     https://aka.ms/azpipelines-parallelism-request  (1–2 business days)
#   Then change `name: Default` below back to `vmImage: ubuntu-latest`.
#
# Required pipeline variables (Pipelines → Edit → Variables):
#
#   ARM_CLIENT_ID       – Service Principal app ID          [secret]
#   ARM_CLIENT_SECRET   – Service Principal password        [secret]
#   ARM_TENANT_ID       – Azure AD tenant ID                [secret]
#   ARM_SUBSCRIPTION_ID – Target Azure subscription ID      [secret]
#
#   TF_STATE_RG         – Resource group of tfstate storage account
#   TF_STATE_SA         – Storage account name for tfstate
#   TF_STATE_CONTAINER  – Blob container name for tfstate
#   TF_STATE_KEY        – Blob key, e.g. wss-poc.tfstate
#
#   ADMIN_CIDR          – CIDR allowed to SSH to the Digital Twin (e.g. 1.2.3.4/32)
#   LOCATION            – Azure region (default: eastus)
#   AUTH_MODE           – "none" or "token" (default: none)
#   SCHEDULE_TOKEN      – Shared secret for token mode      [secret]
# ─────────────────────────────────────────────────────────────────────────────

trigger:
  branches:
    include:
      - feature/poc-wss-unauthorized-client-demo

pr: none

# Self-hosted agent – no parallelism cost on free Azure DevOps orgs.
# See the AGENT POOL NOTE above for setup instructions.
pool:
  name: self-hosted-agent

variables:
  TF_DIR:     $(System.DefaultWorkingDirectory)/infra
  TF_VERSION: "1.8.5"
  # Defaults – override in pipeline UI
  LOCATION:   "eastus"
  AUTH_MODE:  "none"
  ADMIN_CIDR: "0.0.0.0/0"

# ─── Stage 1: Validate ───────────────────────────────────────────────────────
stages:
  - stage: Validate
    displayName: "fmt + validate"
    jobs:
      - job: TerraformValidate
        displayName: "terraform fmt / init / validate"
        steps:
          - checkout: self

          - script: |
              set -euo pipefail
              # Skip install if the correct version is already on the agent
              if terraform version 2>/dev/null | grep -q "$(TF_VERSION)"; then
                echo "Terraform $(TF_VERSION) already installed – skipping."
                terraform version
                exit 0
              fi
              # Install from HashiCorp APT (works on Ubuntu/Debian self-hosted agents)
              curl -fsSL https://apt.releases.hashicorp.com/gpg \
                | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
                https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
              sudo apt-get update -qq
              sudo apt-get install -y "terraform=$(TF_VERSION)-*"
              terraform version
            displayName: "Install Terraform $(TF_VERSION)"

          - script: |
              set -euo pipefail
              terraform fmt -check -recursive $(TF_DIR)
            displayName: "terraform fmt -check"

          - script: |
              set -euo pipefail
              terraform -chdir=$(TF_DIR) init \
                -backend-config="resource_group_name=$(TF_STATE_RG)" \
                -backend-config="storage_account_name=$(TF_STATE_SA)" \
                -backend-config="container_name=$(TF_STATE_CONTAINER)" \
                -backend-config="key=$(TF_STATE_KEY)"
            displayName: "terraform init"
            env:
              ARM_CLIENT_ID:       $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET:   $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID:       $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - script: |
              set -euo pipefail
              terraform -chdir=$(TF_DIR) validate
            displayName: "terraform validate"
            env:
              ARM_CLIENT_ID:       $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET:   $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID:       $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

# ─── Stage 2: Plan ───────────────────────────────────────────────────────────
  - stage: Plan
    displayName: "terraform plan"
    dependsOn: Validate
    jobs:
      - job: TerraformPlan
        displayName: "plan"
        steps:
          - checkout: self

          - script: |
              set -euo pipefail
              # Skip install if the correct version is already on the agent
              if terraform version 2>/dev/null | grep -q "$(TF_VERSION)"; then
                echo "Terraform $(TF_VERSION) already installed – skipping."
                terraform version
                exit 0
              fi
              # Install from HashiCorp APT (works on Ubuntu/Debian self-hosted agents)
              curl -fsSL https://apt.releases.hashicorp.com/gpg \
                | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
                https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
              sudo apt-get update -qq
              sudo apt-get install -y "terraform=$(TF_VERSION)-*"
              terraform version
            displayName: "Install Terraform $(TF_VERSION)"

          - script: |
              set -euo pipefail
              terraform -chdir=$(TF_DIR) init \
                -backend-config="resource_group_name=$(TF_STATE_RG)" \
                -backend-config="storage_account_name=$(TF_STATE_SA)" \
                -backend-config="container_name=$(TF_STATE_CONTAINER)" \
                -backend-config="key=$(TF_STATE_KEY)"
            displayName: "terraform init"
            env:
              ARM_CLIENT_ID:       $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET:   $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID:       $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - script: |
              set -euo pipefail
              terraform -chdir=$(TF_DIR) plan \
                -var="location=$(LOCATION)" \
                -var="admin_cidr=$(ADMIN_CIDR)" \
                -var="auth_mode=$(AUTH_MODE)" \
                -var="schedule_token=$(SCHEDULE_TOKEN)" \
                -out=$(TF_DIR)/tfplan \
                -no-color
            displayName: "terraform plan"
            env:
              ARM_CLIENT_ID:       $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET:   $(ARM_CLIENT_SECRET)
              ARM_TENANT_ID:       $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

          - publish: $(TF_DIR)/tfplan
            artifact: terraform-plan
            displayName: "Publish plan artifact"

# ─── Stage 3: Apply ──────────────────────────────────────────────────────────
  - stage: Apply
    displayName: "terraform apply"
    dependsOn: Plan
    condition: >
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'],
           'refs/heads/feature/poc-wss-unauthorized-client-demo')
      )
    jobs:
      - deployment: TerraformApply
        displayName: "apply"
        # Create a 'wss-poc-lab' environment in Azure DevOps to add approval gates.
        environment: "wss-poc-lab"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    set -euo pipefail
                    wget -q -O- https://apt.releases.hashicorp.com/gpg \
                      | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                    echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
                      https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                      | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
                    sudo apt-get update -qq
                    sudo apt-get install -y "terraform=$(TF_VERSION)-*"
                    terraform version
                  displayName: "Install Terraform $(TF_VERSION)"

                - script: |
                    set -euo pipefail
                    terraform -chdir=$(TF_DIR) init \
                      -backend-config="resource_group_name=$(TF_STATE_RG)" \
                      -backend-config="storage_account_name=$(TF_STATE_SA)" \
                      -backend-config="container_name=$(TF_STATE_CONTAINER)" \
                      -backend-config="key=$(TF_STATE_KEY)"
                  displayName: "terraform init"
                  env:
                    ARM_CLIENT_ID:       $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET:   $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID:       $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

                - script: |
                    set -euo pipefail
                    terraform -chdir=$(TF_DIR) apply \
                      -auto-approve \
                      -var="location=$(LOCATION)" \
                      -var="admin_cidr=$(ADMIN_CIDR)" \
                      -var="auth_mode=$(AUTH_MODE)" \
                      -var="schedule_token=$(SCHEDULE_TOKEN)"
                  displayName: "terraform apply"
                  env:
                    ARM_CLIENT_ID:       $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET:   $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID:       $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

                - script: |
                    set -euo pipefail
                    echo "##[section]Terraform Outputs"
                    terraform -chdir=$(TF_DIR) output -no-color
                  displayName: "Show Terraform outputs"
                  env:
                    ARM_CLIENT_ID:       $(ARM_CLIENT_ID)
                    ARM_CLIENT_SECRET:   $(ARM_CLIENT_SECRET)
                    ARM_TENANT_ID:       $(ARM_TENANT_ID)
                    ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

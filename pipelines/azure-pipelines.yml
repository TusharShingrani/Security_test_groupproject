# ─────────────────────────────────────────────────────────────────────────────
# Azure DevOps Pipeline – WSS Unauthorized Client PoC
#
# Uses plain bash + the official HashiCorp Terraform install script.
# No marketplace extensions required (no TerraformInstaller / TerraformTaskV4).
#
# Azure credentials are passed via an AzureCLI task (service connection) so
# ARM_* environment variables are injected automatically by the hosted agent.
#
# Required pipeline variables (set in the pipeline UI or a variable group):
#   ARM_SERVICE_CONNECTION – name of the Azure Resource Manager service connection
#   TF_STATE_RG            – resource group that holds the tfstate storage account
#   TF_STATE_SA            – storage account name for tfstate
#   TF_STATE_CONTAINER     – blob container name for tfstate
#   TF_STATE_KEY           – blob name, e.g. wss-poc.tfstate
#   ADMIN_CIDR             – CIDR allowed to SSH to the Digital Twin, e.g. 1.2.3.4/32
#   LOCATION               – Azure region, e.g. eastus
#   AUTH_MODE              – "none" (default) or "token"
#   SCHEDULE_TOKEN         – (secret) shared token; only used when AUTH_MODE=token
# ─────────────────────────────────────────────────────────────────────────────

trigger:
  branches:
    include:
      - feature/poc-wss-unauthorized-client-demo

pr: none   # don't run on PRs – this deploys real infrastructure

pool:
  vmImage: ubuntu-latest

variables:
  TF_DIR:     $(System.DefaultWorkingDirectory)/infra
  TF_VERSION: "1.8.5"
  LOCATION:   "eastus"
  AUTH_MODE:  "none"
  ADMIN_CIDR: "0.0.0.0/0"   # tighten to your own IP for real use

# ─── Reusable step template: install Terraform ───────────────────────────────
# Azure-hosted ubuntu-latest agents do not have Terraform pre-installed.
# We install it once per job via the official HashiCorp APT repo.

stages:

  # ── Stage 1: Validate ────────────────────────────────────────────────────────
  - stage: Validate
    displayName: "Terraform fmt + validate"
    jobs:
      - job: TerraformValidate
        displayName: "fmt / init / validate"
        steps:

          - checkout: self

          # Install Terraform from HashiCorp APT – no marketplace extension needed
          - script: |
              set -euo pipefail
              wget -q -O- https://apt.releases.hashicorp.com/gpg \
                | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
                https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                | sudo tee /etc/apt/sources.list.d/hashicorp.list
              sudo apt-get update -qq
              sudo apt-get install -y terraform=$(TF_VERSION)-*
              terraform version
            displayName: "Install Terraform $(TF_VERSION)"

          - script: |
              set -euo pipefail
              cd $(TF_DIR)
              terraform fmt -check -recursive
            displayName: "terraform fmt -check"

          # AzureCLI task injects ARM_CLIENT_ID / ARM_CLIENT_SECRET / ARM_TENANT_ID
          # / ARM_SUBSCRIPTION_ID into the environment automatically.
          - task: AzureCLI@2
            displayName: "terraform init"
            inputs:
              azureSubscription: $(ARM_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true   # injects ARM_* env vars
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                cd $(TF_DIR)
                terraform init \
                  -backend-config="resource_group_name=$(TF_STATE_RG)" \
                  -backend-config="storage_account_name=$(TF_STATE_SA)" \
                  -backend-config="container_name=$(TF_STATE_CONTAINER)" \
                  -backend-config="key=$(TF_STATE_KEY)"

          - task: AzureCLI@2
            displayName: "terraform validate"
            inputs:
              azureSubscription: $(ARM_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                cd $(TF_DIR)
                terraform validate

  # ── Stage 2: Plan ─────────────────────────────────────────────────────────────
  - stage: Plan
    displayName: "Terraform plan"
    dependsOn: Validate
    jobs:
      - job: TerraformPlan
        displayName: "plan"
        steps:

          - checkout: self

          - script: |
              set -euo pipefail
              wget -q -O- https://apt.releases.hashicorp.com/gpg \
                | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
                https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                | sudo tee /etc/apt/sources.list.d/hashicorp.list
              sudo apt-get update -qq
              sudo apt-get install -y terraform=$(TF_VERSION)-*
              terraform version
            displayName: "Install Terraform $(TF_VERSION)"

          - task: AzureCLI@2
            displayName: "terraform init + plan"
            inputs:
              azureSubscription: $(ARM_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                cd $(TF_DIR)
                terraform init \
                  -backend-config="resource_group_name=$(TF_STATE_RG)" \
                  -backend-config="storage_account_name=$(TF_STATE_SA)" \
                  -backend-config="container_name=$(TF_STATE_CONTAINER)" \
                  -backend-config="key=$(TF_STATE_KEY)"
                terraform plan \
                  -var="location=$(LOCATION)" \
                  -var="admin_cidr=$(ADMIN_CIDR)" \
                  -var="auth_mode=$(AUTH_MODE)" \
                  -var="schedule_token=$(SCHEDULE_TOKEN)" \
                  -out=tfplan -no-color | tee plan.txt

          - publish: $(TF_DIR)/tfplan
            artifact: terraform-plan
            displayName: "Publish plan artifact"

  # ── Stage 3: Apply ────────────────────────────────────────────────────────────
  - stage: Apply
    displayName: "Terraform apply"
    dependsOn: Plan
    condition: >
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'],
           'refs/heads/feature/poc-wss-unauthorized-client-demo')
      )
    jobs:
      - deployment: TerraformApply
        displayName: "apply"
        # Create this environment in Azure DevOps to add optional approval gates.
        environment: "wss-poc-lab"
        strategy:
          runOnce:
            deploy:
              steps:

                - checkout: self

                - script: |
                    set -euo pipefail
                    wget -q -O- https://apt.releases.hashicorp.com/gpg \
                      | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
                    echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
                      https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
                      | sudo tee /etc/apt/sources.list.d/hashicorp.list
                    sudo apt-get update -qq
                    sudo apt-get install -y terraform=$(TF_VERSION)-*
                    terraform version
                  displayName: "Install Terraform $(TF_VERSION)"

                - task: AzureCLI@2
                  displayName: "terraform init + apply"
                  inputs:
                    azureSubscription: $(ARM_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      cd $(TF_DIR)
                      terraform init \
                        -backend-config="resource_group_name=$(TF_STATE_RG)" \
                        -backend-config="storage_account_name=$(TF_STATE_SA)" \
                        -backend-config="container_name=$(TF_STATE_CONTAINER)" \
                        -backend-config="key=$(TF_STATE_KEY)"
                      terraform apply \
                        -auto-approve \
                        -var="location=$(LOCATION)" \
                        -var="admin_cidr=$(ADMIN_CIDR)" \
                        -var="auth_mode=$(AUTH_MODE)" \
                        -var="schedule_token=$(SCHEDULE_TOKEN)"

                - task: AzureCLI@2
                  displayName: "Show Terraform outputs"
                  inputs:
                    azureSubscription: $(ARM_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      cd $(TF_DIR)
                      echo "##[section]Terraform Outputs"
                      terraform output -no-color

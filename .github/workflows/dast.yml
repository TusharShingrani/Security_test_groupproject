name: DAST — ZAP Baseline Scan

# Runs automatically every Monday at 06:00 UTC and on manual trigger.
on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan (default: live Gitea)"
        required: false
        default: "https://ca-gitea.wittydune-da50dd5c.norwayeast.azurecontainerapps.io"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP — Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p zap-output

      - name: ZAP Baseline Scan
        run: |
          TARGET="${{ github.event.inputs.target_url || 'https://ca-gitea.wittydune-da50dd5c.norwayeast.azurecontainerapps.io' }}"
          echo "Scanning: $TARGET"
          docker run --rm \
            -v ${{ github.workspace }}/zap-output:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "$TARGET" \
              -r zap-report.html \
              -J zap-report.json \
              -w zap-report.md \
              -I \
              -d \
            || true   # exit 1 = warnings found; exit 2 = errors; we capture both
        continue-on-error: true

      - name: Show report summary
        run: |
          echo "=== Files generated ==="
          ls -lh zap-output/
          echo ""
          echo "=== ZAP Markdown Summary ==="
          cat zap-output/zap-report.md 2>/dev/null || echo "(no markdown report found)"

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: zap-output/
          retention-days: 30

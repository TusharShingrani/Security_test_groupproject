name: DAST — ZAP Baseline Scan

# Runs automatically every Monday at 06:00 UTC and on manual trigger.
on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan (default: live Gitea)"
        required: false
        default: "https://ca-gitea.wittydune-da50dd5c.norwayeast.azurecontainerapps.io"

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP — Baseline Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create output directory
        run: |
          mkdir -p zap-output
          chmod 777 zap-output

      - name: ZAP Baseline Scan
        run: |
          TARGET="${{ github.event.inputs.target_url || 'https://ca-gitea.wittydune-da50dd5c.norwayeast.azurecontainerapps.io' }}"
          echo "Scanning: $TARGET"
          docker run --rm \
            -v ${{ github.workspace }}/zap-output:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "$TARGET" \
              -r zap-report.html \
              -J zap-report.json \
              -w zap-report.md \
              -I
          echo "ZAP exit code: $?"
          exit 0

      - name: Publish Job Summary
        if: always()
        run: |
          REPORT="zap-output/zap-report.json"

          if [ ! -f "$REPORT" ]; then
            echo "## :warning: ZAP Scan — no report generated" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          HIGH=$(jq   '[.site[0].alerts[] | select(.riskcode == "3")] | length' "$REPORT")
          MEDIUM=$(jq '[.site[0].alerts[] | select(.riskcode == "2")] | length' "$REPORT")
          LOW=$(jq    '[.site[0].alerts[] | select(.riskcode == "1")] | length' "$REPORT")
          INFO=$(jq   '[.site[0].alerts[] | select(.riskcode == "0")] | length' "$REPORT")
          TARGET="${{ github.event.inputs.target_url || 'https://ca-gitea.wittydune-da50dd5c.norwayeast.azurecontainerapps.io' }}"

          if [ "$HIGH" -gt 0 ]; then
            BADGE=":red_circle: FAIL"
          elif [ "$MEDIUM" -gt 0 ]; then
            BADGE=":yellow_circle: WARN"
          else
            BADGE=":green_circle: PASS"
          fi

          {
            echo "## OWASP ZAP Baseline Scan"
            echo ""
            echo "**Target:** \`$TARGET\`"
            echo ""
            echo "| Result | :red_circle: High | :yellow_circle: Medium | :large_blue_circle: Low | :white_circle: Info |"
            echo "|---|---|---|---|---|"
            echo "| **$BADGE** | $HIGH | $MEDIUM | $LOW | $INFO |"
            echo ""
            echo "### Alerts"
            echo ""
            echo "| Risk | Alert | Instances |"
            echo "|---|---|---|"
            jq -r '.site[0].alerts[] |
              if   .riskcode == "3" then "| :red_circle: High"
              elif .riskcode == "2" then "| :yellow_circle: Medium"
              elif .riskcode == "1" then "| :large_blue_circle: Low"
              else                       "| :white_circle: Info"
              end + " | \(.name) | \(.count) |"' "$REPORT"
            echo ""
            echo "> Full HTML report available in the \`zap-reports\` artifact below."
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: zap-output/
          retention-days: 30

# ───────────────────────────────────────────────────────────────────────
# GitHub Actions - Terraform Deploy (Azure OIDC)
#
# Authenticates to Azure using OIDC (no client secret stored in GitHub).
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AZURE_CLIENT_ID       - Service Principal / App Registration client ID
#   AZURE_TENANT_ID       - Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID - Azure subscription ID
#
# Required GitHub Variables (Settings → Variables → Actions):
#   TF_STATE_RG         - Resource group of the tfstate storage account
#   TF_STATE_SA         - Storage account name
#   TF_STATE_CONTAINER  - Blob container name
#   TF_STATE_KEY        - Blob key (e.g. wss-poc.tfstate)
#   ADMIN_CIDR          - CIDR for SSH access (e.g. 1.2.3.4/32)
#   AUTH_MODE           - "none" or "token"  (default: none)
#
# Optional secret:
#   SCHEDULE_TOKEN      - Required only when AUTH_MODE=token
#
# Azure OIDC setup (one-time):
#   1. Create an App Registration in Azure AD
#   2. Grant it Contributor on your subscription
#   3. Add a Federated Credential:
#      - Issuer:  https://token.actions.githubusercontent.com
#      - Subject: repo:<org>/<repo>:ref:refs/heads/feature/poc-wss-unauthorized-client-demo
#      - Audience: api://AzureADTokenExchange
#   4. Add the three secrets above to this GitHub repo
# ───────────────────────────────────────────────────────────────────────

name: Terraform Deploy

on:
  push:
    branches:
      - feature/poc-wss-unauthorized-client-demo
    paths:
      - 'infra/**'
      - 'app/**'
      - 'systemd/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:  # allow manual trigger from the Actions tab

permissions:
  id-token: write   # required for OIDC token request
  contents: read

env:
  TF_VERSION: "1.8.5"
  TF_WORKING_DIR: infra

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Login to Azure via OIDC (no secrets stored - token exchanged at runtime)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 4. Terraform Init (backend config from GitHub Variables)
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}"
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 5. Terraform Validate
      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 6. Terraform Plan
      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="admin_cidr=${{ vars.ADMIN_CIDR }}" \
            -var="auth_mode=${{ vars.AUTH_MODE || 'none' }}" \
            -var="schedule_token=${{ secrets.SCHEDULE_TOKEN || 'changeme-token' }}" \
            -out=tfplan \
            -no-color
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 7. Terraform Apply
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 8. Show outputs (Digital Twin public IP, SSH command, etc.)
      - name: Terraform Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output -no-color
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

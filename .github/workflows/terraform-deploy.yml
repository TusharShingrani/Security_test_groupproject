# ───────────────────────────────────────────────────────────────────────
# GitHub Actions - Terraform Deploy / Destroy (Azure OIDC)
#
# Trigger manually from the Actions tab.
# Use the ACTION input to choose:
#   apply   - deploy the 3-VM lab
#   destroy - tear down everything in rg-wss-poc
#
# Required GitHub Secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, SCHEDULE_TOKEN
#
# Required GitHub Variables:
#   TF_STATE_RG, TF_STATE_SA, TF_STATE_CONTAINER, TF_STATE_KEY
#   ADMIN_CIDR, LOCATION, AUTH_MODE
# ───────────────────────────────────────────────────────────────────────

name: Terraform Deploy

on:
  push:
    branches:
      - feature/poc-wss-unauthorized-client-demo
    paths:
      - 'infra/**'
      - 'app/**'
      - 'systemd/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.8.5"
  TF_WORKING_DIR: infra

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}"
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ─────────────────────────────────────────────────────────────
      # APPLY path
      # ─────────────────────────────────────────────────────────────

      - name: Terraform Validate
        if: ${{ (github.event.inputs.action || 'apply') == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Plan
        if: ${{ (github.event.inputs.action || 'apply') == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="location=${{ vars.LOCATION }}" \
            -var="admin_cidr=${{ vars.ADMIN_CIDR }}" \
            -var="auth_mode=${{ vars.AUTH_MODE || 'none' }}" \
            -var="schedule_token=${{ secrets.SCHEDULE_TOKEN || 'changeme-token' }}" \
            -out=tfplan \
            -no-color
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Apply
        if: ${{ (github.event.inputs.action || 'apply') == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Outputs
        if: ${{ (github.event.inputs.action || 'apply') == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output -no-color
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ─────────────────────────────────────────────────────────────
      # DESTROY path
      # ─────────────────────────────────────────────────────────────

      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform destroy \
            -auto-approve \
            -var="location=${{ vars.LOCATION }}" \
            -var="admin_cidr=${{ vars.ADMIN_CIDR }}" \
            -var="auth_mode=${{ vars.AUTH_MODE || 'none' }}" \
            -var="schedule_token=${{ secrets.SCHEDULE_TOKEN || 'changeme-token' }}"
        env:
          ARM_USE_OIDC:        "true"
          ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

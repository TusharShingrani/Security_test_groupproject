name: Security Pipeline

on:
  push:
    branches:
      - feature/secure-cloud-platform-gitea
    paths:
      - 'terraform/**'
      - 'containers/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC

jobs:
  # ── 1. Secret Scanning ────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks — Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fails the job if any secrets are detected in the repo

  # ── 2. Terraform Validation ───────────────────────────────────────────────
  terraform-checks:
    name: Terraform — Validate & Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive
        # Fails if any .tf file is not properly formatted

      - name: Terraform Init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # ── 3. IaC Security Scan ─────────────────────────────────────────────────
  checkov:
    name: Checkov — IaC Security Scan
    runs-on: ubuntu-latest
    needs: terraform-checks
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          # Skipped checks — each is a documented PoC trade-off:
          # CKV_AZURE_109 / CKV_AZURE_189: KV network_acls=Allow — Container Apps
          #   Consumption plan has no VNet injection; KV must be reachable over public
          #   endpoint. Mitigated by access_policy restricting to managed identity only.
          # CKV_AZURE_110: Purge protection disabled — needed for easy PoC teardown.
          # CKV2_AZURE_32: KV private endpoint — requires VNet injection (costs extra).
          # CKV_AZURE_41: Secret expiration date — not set for PoC longevity.
          # CKV_AZURE_59: Storage public network access — Container Apps Consumption
          #   plan requires public endpoint to mount Azure Files.
          # CKV_AZURE_33: Queue storage logging — no queues used in this deployment.
          # CKV_AZURE_206: Storage GRS replication — LRS sufficient for PoC.
          # CKV2_AZURE_41: SAS expiration policy — SAS tokens not used; shared key only.
          # CKV2_AZURE_38: Blob soft-delete — using file shares, not blob storage.
          # CKV2_AZURE_40: Shared key auth — required for Container Apps Azure Files mount.
          # CKV2_AZURE_1: Customer Managed Key — unnecessary complexity for PoC.
          # CKV2_AZURE_33: Storage private endpoint — requires VNet injection (costs extra).
          # CKV_AZURE_42: KV recoverability requires purge_protection=true — disabled for PoC teardown convenience.
          skip_check: "CKV_AZURE_109,CKV_AZURE_189,CKV_AZURE_110,CKV_AZURE_42,CKV2_AZURE_32,CKV_AZURE_41,CKV_AZURE_59,CKV_AZURE_33,CKV_AZURE_206,CKV2_AZURE_41,CKV2_AZURE_38,CKV2_AZURE_40,CKV2_AZURE_1,CKV2_AZURE_33"

      - name: Upload Checkov results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results
          path: checkov-results.sarif
          retention-days: 30

  # ── 4. Container Image Scan ───────────────────────────────────────────────
  trivy:
    name: Trivy — Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Gitea image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gitea/gitea:latest-rootless
          format: table
          output: trivy-results.txt
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: CRITICAL,HIGH
        # Fails if CRITICAL or HIGH unfixed CVEs are found (Go stdlib CVEs requiring upstream rebuild are in .trivyignore)

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.txt
          retention-days: 30

  # ── 5. Deploy (apply) ─────────────────────────────────────────────────────
  deploy:
    name: Terraform — Deploy
    runs-on: ubuntu-latest
    needs: [gitleaks, terraform-checks, checkov, trivy]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/secure-cloud-platform-gitea'

    env:
      ARM_USE_OIDC:        "true"
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Register required Azure resource providers
        run: |
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=gitea-sec.tfstate"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="gitea_admin_password=${{ secrets.GITEA_ADMIN_PASSWORD }}" \
            -var="gitea_oidc_client_secret=${{ secrets.GITEA_OIDC_CLIENT_SECRET }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Output Gitea URL
        working-directory: terraform
        run: terraform output gitea_url

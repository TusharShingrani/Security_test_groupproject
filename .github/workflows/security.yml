name: Security Pipeline

on:
  push:
    branches:
      - feature/secure-cloud-platform-gitea
    paths:
      - 'terraform/**'
      - 'containers/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC

jobs:
  # ── 1. Secret Scanning ────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks — Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fails the job if any secrets are detected in the repo

  # ── 2. Terraform Validation ───────────────────────────────────────────────
  terraform-checks:
    name: Terraform — Validate & Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive
        # Fails if any .tf file is not properly formatted

      - name: Terraform Init (no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # ── 3. IaC Security Scan ─────────────────────────────────────────────────
  checkov:
    name: Checkov — IaC Security Scan
    runs-on: ubuntu-latest
    needs: terraform-checks
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: false          # hard fail on HIGH/CRITICAL findings
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          skip_check: >-
            CKV_AZURE_109,
            CKV2_AZURE_38
            # CKV_AZURE_109: KV network_acls Allow (intentional for PoC demo)
            # CKV2_AZURE_38: Storage blob soft-delete (not needed for file share PoC)

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
        continue-on-error: true

  # ── 4. Container Image Scan ───────────────────────────────────────────────
  trivy:
    name: Trivy — Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Gitea image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gitea/gitea:latest-rootless
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: CRITICAL,HIGH
        # Fails if CRITICAL or HIGH unfixed CVEs are found (Go stdlib CVEs requiring upstream rebuild are in .trivyignore)

      - name: Trivy SARIF output
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: gitea/gitea:latest-rootless
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ── 5. Deploy (apply) ─────────────────────────────────────────────────────
  deploy:
    name: Terraform — Deploy
    runs-on: ubuntu-latest
    needs: [gitleaks, terraform-checks, checkov, trivy]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feature/secure-cloud-platform-gitea'
    environment: production

    env:
      ARM_USE_OIDC:        "true"
      ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=gitea-sec.tfstate"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="gitea_admin_password=${{ secrets.GITEA_ADMIN_PASSWORD }}" \
            -var="gitea_oidc_client_secret=${{ secrets.GITEA_OIDC_CLIENT_SECRET }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Output Gitea URL
        working-directory: terraform
        run: terraform output gitea_url
